
name: Playwright BDD Automation CI

on:
  push:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  playwright-tests:
    name: Run Playwright BDD Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Install Playwright Chromium
      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # 5. Execute Cucumber BDD tests
      - name: Run BDD Tests
        run: npx cucumber-js

      # 6. Upload reports and test artifacts
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-bdd-test-results
          path: |
            reports/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
